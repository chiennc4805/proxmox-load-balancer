name: proxmox-gateway

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_DB: ${POSTGRES_DB:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in src/app/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  gateway:
    build: .
    image: proxmox-gateway:dev
    env_file: src/app/.env
    environment:
      DATABASE_DSN: postgresql://${POSTGRES_USER:-gateway}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gateway}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  tracker:
    image: proxmox-gateway:dev
    pull_policy: never
    command: ["python", "-m", "app.tracker"]
    env_file: src/app/.env
    environment:
      DATABASE_DSN: postgresql://${POSTGRES_USER:-gateway}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gateway}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
